<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stranger Things Character Matcher</title>

    <!-- Stranger Things font -->
    <link href="https://fonts.googleapis.com/css2?family=Benguiat+Std&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- External JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

<h1>STRANGER THINGS</h1>

<div class="character-box" id="characterDisplay">
    <!-- Character image will be appended here -->
</div>

<div class="question">
    <p>What era of the 1900s does Stranger Things take place in?</p>
    <input type="text" id="eraInput">
</div>

<div class="question">
    <p>Describe yourself one adjective.</p>
    <p>(Ambitious, Observant, Loyal, Intelligent, Rational, Strong, Tough)</p>
    <input type="text" id="adjectiveInput">
</div>

<button id="submitBtn">Submit</button>

<div id="output"></div>

</body>
</html>
